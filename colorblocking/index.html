<!DOCTYPE html>
<html lang="en">
<head>

       (CanvasKit) and inline styles. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; worker-src 'self' blob:; connect-src 'self' blob: data:; img-src 'self' data: blob:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; manifest-src 'self'; media-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Unlisted for now: search engines are asked to leave it out. -->
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Turn a reference photo into the block-in of a painting: big flat shapes with true values and temperatures, with value, notan, temperature and line studies. Runs in your browser; pictures never leave your device.">
  <meta name="theme-color" content="#141414">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Colorblocking">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">
  <title>Colorblocking</title>
  <style>
    html, body { margin: 0; height: 100%; background: #141414; }
  </style>
</head>
